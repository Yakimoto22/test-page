// ---- boucle
function boucle(t) {

  requestAnimationFrame(boucle);
}

    for (const e of niv.evs) if (e.type === 'silure') {

      if (e.phase === 0 && d < 34) { e.phase = 1; e.t = 0; }

      if (e.phase === 2) { e.t += dt; e.x = lerp(COULOIRS[e.c0], COULOIRS[e.c1], clamp(e.t / 0.45, 0, 1)); if (e.t >= 0.45) { e.phase = 3; e.c = e.c1; } }

let geste = null;

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1822">
<meta name="apple-mobile-web-app-capable" content="yes">
<!--WRAP-END-->
<title>Marée</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Une scène plein écran (canvas) pour le jeu, la carte et le lac ; les écrans sont des calques HTML.
   Direction artistique sobre : encre profonde, blanc cassé, or mat ; typographie fine et espacée. */
:root {
  --abysse: #0b1822;    /* panneaux, texte foncé */
  --abysse-2: #13232f;
  --lagon: #3d7d96;
  --ecume: #f3efe6;     /* texte clair */
  --brume: #93a6b3;     /* texte secondaire */
  --corail: #d98a6a;    /* accent principal */
  --corail-fonce: #b46a4c;
  --or: #d9b56f;
  --ligne: rgba(243,239,230,.16);
  --verre: rgba(11,24,34,.62);
  --f-titre: "Outfit", "Helvetica Neue", system-ui, sans-serif;
  --f-texte: "Inter", "Helvetica Neue", system-ui, sans-serif;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--abysse); }
body {
  color: var(--ecume); font: 400 15px/1.4 var(--f-texte); letter-spacing: .01em;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
}
#app { position: relative; height: 100%; overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font: inherit; }
.rond {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--ligne); flex: none; cursor: pointer;
  background: var(--verre); color: var(--ecume); font: 400 16px/1 var(--f-titre);
  display: grid; place-items: center; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.rond:focus-visible, .btn:focus-visible { outline: 2px solid var(--or); outline-offset: 3px; }

/* ---- HUD de partie */
#hud {
  position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 10px;
  padding-top: 12px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
#hud > * { pointer-events: auto; }
#hud-centre { flex: 1; min-width: 0; text-align: center; text-shadow: 0 1px 6px rgba(0,0,0,.35); pointer-events: none !important; display: grid; gap: 2px; }
#hud-nom { display: block; font: 500 13px/1.1 var(--f-titre); letter-spacing: .22em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#hud-sub { font-size: 11px; opacity: .7; letter-spacing: .08em; font-variant-numeric: tabular-nums; }
#hud-droite { display: grid; justify-items: end; gap: 5px; pointer-events: none !important; }
#coeurs { font-size: 13px; letter-spacing: 4px; color: var(--ecume); text-shadow: 0 1px 4px rgba(0,0,0,.4); line-height: 1; }
#coeurs i { font-style: normal; color: rgba(243,239,230,.25); }
#perles-hud { background: var(--verre); border: 1px solid var(--ligne); border-radius: 999px; padding: 3px 10px 3px 7px; font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
#perles-hud b { color: var(--ecume); font-weight: 600; }
.piece { display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: -1px;
  background: radial-gradient(circle at 35% 30%, #f6e7c4, #d9b56f 55%, #a7834a); box-shadow: inset 0 0 0 1px rgba(110,80,35,.6); }
#progres { position: absolute; left: 0; right: 0; top: 0; height: 2px; background: rgba(255,255,255,.12); pointer-events: none; }
#progres i { display: block; height: 100%; width: 0; background: var(--ecume); }

/* ---- Série : chiffre flottant, sans cadre */
#serie {
  position: absolute; left: 50%; top: 58px; transform: translateX(-50%); pointer-events: none;
  display: grid; justify-items: center; gap: 3px; font-variant-numeric: tabular-nums; white-space: nowrap;
  --ton: #f3efe6; --halo: rgba(255,255,255,0); transition: opacity .35s;
}
#serie.zero { opacity: 0; }
#serie .lbl { font: 500 9px/1 var(--f-titre); letter-spacing: .4em; text-transform: uppercase; color: var(--ton); opacity: .8; text-shadow: 0 1px 4px rgba(5,20,35,.6); }
#serie b { font: 200 48px/0.95 var(--f-titre); color: var(--ton); text-shadow: 0 2px 12px rgba(5,20,35,.35), 0 0 22px var(--halo); transition: color .4s; }
#serie .jauge { width: 56px; height: 1.5px; background: rgba(255,255,255,.22); overflow: hidden; }
#serie .jauge i { display: block; height: 100%; width: 0; background: var(--ton); transition: width .3s ease-out; }
#serie .info { font-size: 10px; letter-spacing: .08em; color: #fff; opacity: .75; text-shadow: 0 1px 3px rgba(5,20,35,.8); }
#serie .mult { position: absolute; left: 100%; top: 16px; margin-left: 8px; font: 300 17px/1 var(--f-titre); color: var(--ton); text-shadow: 0 0 10px var(--halo); }
#serie.t1 { --ton: #f1e2bd; --halo: rgba(241,226,189,.25); }
#serie.t2 { --ton: #e8c784; --halo: rgba(232,199,132,.4); }
#serie.t3 { --ton: #e7a77e; --halo: rgba(231,167,126,.5); }
#serie.t4 { --ton: #bfe3e8; --halo: rgba(170,225,235,.7); animation: lueur 1.6s ease-in-out infinite; }
#serie.pop b { animation: pop .3s cubic-bezier(.3,1.4,.5,1); }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.14); } 100% { transform: scale(1); } }
@keyframes lueur { 50% { filter: brightness(1.18); } }
#serie-perdue { position: absolute; left: 50%; top: 150px; transform: translateX(-50%); pointer-events: none; font: 400 12px/1 var(--f-titre); letter-spacing: .3em; text-transform: uppercase; color: #f0b9a6; text-shadow: 0 1px 6px rgba(0,0,0,.6); animation: perdue 1.4s ease-out forwards; white-space: nowrap; }
@keyframes perdue { 0% { opacity: 0; transform: translate(-50%, -6px); } 15% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, 12px); } }
#flash { position: absolute; inset: 0; pointer-events: none; animation: flash .6s ease-out forwards; }
@keyframes flash { from { opacity: .7; } to { opacity: 0; } }
#banniere { position: absolute; left: 0; right: 0; top: 27%; text-align: center; pointer-events: none; animation: banniere 2.8s ease-in-out forwards; text-shadow: 0 1px 14px rgba(5,20,35,.55); }
#banniere > * { width: fit-content; margin-inline: auto; }
#banniere small { display: block; font: 500 10px/1 var(--f-titre); letter-spacing: .45em; text-transform: uppercase; opacity: .85; margin-bottom: 10px; }
#banniere b { display: block; font: 200 clamp(30px, 10vw, 48px)/1.05 var(--f-titre); letter-spacing: .06em; color: var(--ecume); max-width: 92vw; text-wrap: balance; }
#banniere b::after { content: ""; display: block; width: 40px; height: 1px; margin: 14px auto 0; background: var(--or); }
@keyframes banniere { 0% { opacity: 0; transform: translateY(10px); letter-spacing: .02em; } 14% { opacity: 1; transform: none; } 78% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }
#hint { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; pointer-events: none; text-wrap: balance;
  padding: 0 max(18px, env(safe-area-inset-right, 0px)) calc(26px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); font-size: 14px; text-shadow: 0 1px 6px rgba(0,0,0,.5); }
#hint .go { display: block; margin-top: 10px; font: 500 11px/1 var(--f-titre); letter-spacing: .35em; text-transform: uppercase; color: var(--ecume); animation: pouls 1.8s ease-in-out infinite; }
@keyframes pouls { 50% { opacity: .35; } }

/* ---- Écrans */
.ecran {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center;
  padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: rgba(7,16,24,.55); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
}
.ecran.clair { background: linear-gradient(to bottom, rgba(7,16,24,0) 30%, rgba(7,16,24,.78) 82%); -webkit-backdrop-filter: none; backdrop-filter: none; justify-content: flex-end; padding-block: 48px; }
.panneau { background: rgba(11,24,34,.86); border: 1px solid var(--ligne); border-radius: 14px; padding: 28px 22px 22px; width: min(100%, 340px); display: flex; flex-direction: column; align-items: center; gap: 12px; box-shadow: 0 24px 60px rgba(0,0,0,.35); }
h1, h2 { margin: 0; font-family: var(--f-titre); text-wrap: balance; }
h1 { font-size: clamp(54px, 17vw, 96px); font-weight: 200; line-height: 1; letter-spacing: .32em; margin-right: -.32em; text-transform: uppercase; color: var(--ecume); text-shadow: 0 2px 24px rgba(5,20,35,.35); }
#ecran-titre h1 { margin-bottom: auto; margin-top: 18vh; }
#ecran-titre h1::after { content: ""; display: block; width: 48px; height: 1px; margin: 22px auto 0; background: var(--or); transform: translateX(-.16em); }
h2 { font-size: 26px; font-weight: 300; letter-spacing: .14em; text-transform: uppercase; line-height: 1.1; color: var(--ecume); }
.sous { margin: 0; max-width: 30ch; color: var(--brume); text-shadow: 0 1px 3px rgba(0,0,0,.45); }
.petit { margin: 0; color: var(--brume); font-size: 12px; }
.btn { border: 1px solid transparent; border-radius: 8px; cursor: pointer; font: 500 13px/1 var(--f-titre); letter-spacing: .2em; text-transform: uppercase;
  padding: 16px 28px; min-width: 220px; background: var(--ecume); color: var(--abysse); transition: transform .12s, background .2s, opacity .2s; }
.btn:active { transform: scale(.97); }
.btn.second { background: rgba(11,24,34,.35); border-color: rgba(243,239,230,.35); color: var(--ecume); font-size: 11px; padding: 13px 20px; }
.btn.or { background: transparent; border-color: rgba(217,181,111,.65); color: var(--or); font-size: 11px; padding: 13px 20px; }
.btn.enorme { font-size: 14px; padding: 19px 34px; min-width: 240px; }
.rangee { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.etoiles { font-size: 30px; letter-spacing: 10px; margin-right: -10px; color: var(--or); line-height: 1; }
.etoiles i { font-style: normal; color: rgba(243,239,230,.16); }
.stats { list-style: none; margin: 4px 0; padding: 0; display: grid; gap: 6px; font-size: 13px; color: var(--brume); }
.stats b { color: var(--ecume); font-weight: 600; }
.score { margin: 0; font: 200 72px/1 var(--f-titre); font-variant-numeric: tabular-nums; letter-spacing: .02em; }

/* ---- Carte */
#carte-tete {
  position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 8px;
  padding: 12px max(14px, env(safe-area-inset-right, 0px)) 14px max(14px, env(safe-area-inset-left, 0px));
  background: linear-gradient(to bottom, rgba(7,16,24,.7), rgba(7,16,24,0)); pointer-events: none;
}
#carte-tete > * { pointer-events: auto; }
#carte-tete h2 { flex: 1; font-size: 13px; font-weight: 500; letter-spacing: .3em; text-align: left; text-shadow: 0 1px 6px rgba(0,0,0,.4); }
.jeton { background: var(--verre); border: 1px solid var(--ligne); border-radius: 999px; padding: 6px 11px; font-size: 12px; font-weight: 500; white-space: nowrap; font-variant-numeric: tabular-nums; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.jeton b { color: var(--ecume); font-weight: 600; }
#carte-pied { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; align-items: center; gap: 8px; pointer-events: none;
  padding: 14px 14px calc(18px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, rgba(7,16,24,.75), rgba(7,16,24,0)); }
#carte-pied > * { pointer-events: auto; }
#carte-pied .btn { min-width: 0; padding-inline: 16px; flex: 0 1 auto; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); background: var(--verre); }
#fiche { position: absolute; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(92vw, 330px);
  background: rgba(11,24,34,.9); border: 1px solid var(--ligne); border-radius: 14px; padding: 18px 18px 16px; display: grid; gap: 9px; text-align: center; box-shadow: 0 18px 50px rgba(0,0,0,.4); animation: monte .25s ease-out;
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
#fiche small { color: var(--brume); letter-spacing: .3em; text-transform: uppercase; font-size: 10px; font-weight: 500; }
#fiche h3 { margin: 0; font: 300 24px/1.1 var(--f-titre); letter-spacing: .04em; }
#fiche .etoiles { font-size: 18px; letter-spacing: 8px; margin-right: -8px; }
#fiche .btn { min-width: 0; }
@keyframes monte { from { transform: translate(-50%, 14px); opacity: 0; } }
/* ---- Boutique */
#ecran-boutique { justify-content: flex-start; gap: 14px; background: linear-gradient(180deg, #0b1822 0%, #102230 70%, #132a3a 100%); -webkit-backdrop-filter: none; backdrop-filter: none; overflow-y: auto; padding-block: 14px 0; }
.bout-tete { display: flex; align-items: center; gap: 10px; width: min(100%, 560px); }
.bout-tete h2 { flex: 1; text-align: left; font-size: 13px; font-weight: 500; letter-spacing: .3em; }
.onglets { display: flex; gap: 0; width: min(100%, 560px); border-bottom: 1px solid var(--ligne); }
.onglets button { flex: 1; min-width: 0; border: 0; border-bottom: 1.5px solid transparent; margin-bottom: -1px; padding: 12px 2px 11px; background: transparent; color: var(--brume); font: 500 10.5px/1 var(--f-titre); letter-spacing: .16em; text-transform: uppercase; cursor: pointer; }
.onglets button.actif { border-bottom-color: var(--ecume); color: var(--ecume); }
#bout-contenu { width: min(100%, 560px); display: grid; gap: 12px; padding-bottom: calc(30px + env(safe-area-inset-bottom, 0px)); text-align: left; }
.note { margin: 0; color: var(--brume); font-size: 12px; text-align: center; }
.cat-titre { margin: 10px 0 0; font: 500 10.5px/1 var(--f-titre); letter-spacing: .3em; text-transform: uppercase; color: var(--brume); }
.cartes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.carte-obj { background: rgba(243,239,230,.04); border-radius: 10px; padding: 8px 8px 12px; display: grid; gap: 6px; justify-items: center; text-align: center; border: 1px solid var(--ligne); cursor: pointer; color: var(--ecume); font: inherit; }
.carte-obj canvas { width: 100%; height: auto; aspect-ratio: 4 / 3; border-radius: 6px; display: block; }
.carte-obj .nom { font: 400 14px/1.15 var(--f-titre); letter-spacing: .03em; }
.carte-obj.equipe { border-color: var(--or); box-shadow: inset 0 0 0 1px var(--or); }
.rar { font: 500 9.5px/1 var(--f-titre); letter-spacing: .26em; text-transform: uppercase; }
.mini { border: 1px solid rgba(243,239,230,.4); border-radius: 6px; padding: 8px 12px; font: 500 10.5px/1 var(--f-titre); letter-spacing: .14em; text-transform: uppercase; background: transparent; color: var(--ecume); cursor: pointer; }
.mini:disabled { border-color: transparent; color: var(--brume); opacity: .7; cursor: default; }
.boite-carte { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; background: rgba(243,239,230,.04); border: 1px solid var(--ligne); border-radius: 12px; padding: 16px; }
.boite-carte h3 { margin: 0; font: 300 19px/1.1 var(--f-titre); letter-spacing: .06em; }
.chances { margin: 6px 0 10px; font-size: 11.5px; color: var(--brume); line-height: 1.6; }
.chances b { font-weight: 600; }
/* Coffret : bois sombre et ferrures, pas de paquet cadeau */
.boite { position: relative; width: 84px; height: 72px; margin: auto; --b1: #6d7f8c; --b2: #3c4a55; --fer: #c9a86a; }
.boite .corps { position: absolute; left: 6px; right: 6px; bottom: 0; height: 46px; border-radius: 3px; background: linear-gradient(var(--b1), var(--b2)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), 0 8px 18px rgba(0,0,0,.35); }
.boite .couvercle { position: absolute; left: 3px; right: 3px; top: 12px; height: 16px; border-radius: 4px 4px 2px 2px; background: linear-gradient(var(--b1), var(--b2)); box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 2px 0 rgba(0,0,0,.25); transition: transform .4s cubic-bezier(.3,1.2,.5,1), opacity .4s; }
.boite .ruban { position: absolute; left: 50%; top: 22px; width: 12px; height: 16px; margin-left: -6px; border-radius: 2px; background: var(--fer); box-shadow: 0 1px 2px rgba(0,0,0,.4); z-index: 2; }
.boite .noeud { position: absolute; left: 14px; right: 14px; bottom: 0; top: 12px; border-left: 2px solid var(--fer); border-right: 2px solid var(--fer); opacity: .7; }
.boite.ouverte .couvercle { transform: translateY(-46px) rotate(-14deg); opacity: 0; }
.boite.ouverte .ruban { opacity: 0; transition: opacity .2s; }
.boite.secoue { animation: secoue .7s ease-in-out; }
@keyframes secoue { 20% { transform: rotate(-3deg); } 40% { transform: rotate(3deg); } 60% { transform: rotate(-2deg) scale(1.03); } 80% { transform: rotate(2deg) scale(1.05); } }
#ecran-ouverture { gap: 18px; background: rgba(5,12,18,.88); }
#ouv-boite { transform: scale(2.2); margin: 50px 0 40px; }
#lot { display: grid; justify-items: center; gap: 8px; padding: 20px 22px; border-radius: 14px; border: 1px solid var(--ligne); background: var(--abysse); width: min(92vw, 320px); animation: revele .5s cubic-bezier(.2,1,.4,1); box-shadow: 0 0 80px var(--lueur, rgba(255,255,255,.12)); }
#lot canvas { width: 100%; height: auto; border-radius: 8px; }
#lot b { font: 300 24px/1.1 var(--f-titre); letter-spacing: .04em; }
@keyframes revele { from { transform: translateY(16px) scale(.94); opacity: 0; } }
.monde-carte { background: rgba(243,239,230,.04); border: 1px solid var(--ligne); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
.monde-carte canvas { width: 100%; height: auto; border-radius: 8px; }

@media (prefers-reduced-motion: reduce) { #serie.pop b, #serie.t4, #serie-perdue, #flash, #banniere, #hint .go, #fiche, .boite.secoue, #lot { animation: none; } }
</style>
<!--WRAP-HEAD-END-->
</head>
<body>
<!--WRAP-BODY-START-->
<div id="app">
  <canvas id="cv" aria-label="Scène du jeu : touche en haut de l’écran pour monter l’eau, en bas pour la baisser"></canvas>

  <div id="progres" hidden><i id="progres-i"></i></div>
  <div id="hud" hidden>
    <button class="rond" id="b-pause" aria-label="Pause">II</button>
    <div id="hud-centre"><span id="hud-nom">La rivière</span><span id="hud-sub">1-1</span></div>
    <div id="hud-droite"><span id="coeurs">♥♥♥</span><span id="perles-hud"><i class="piece"></i> <b id="perles-n">0</b></span></div>
  </div>
  <div id="serie" class="zero" hidden><span class="lbl">Série</span><b id="serie-n">0</b><span class="jauge"><i id="serie-jauge"></i></span><span class="info" id="serie-info"></span><span class="mult" id="serie-mult" hidden>×2</span></div>
  <div id="serie-perdue" hidden></div>
  <div id="flash" hidden></div>
  <div id="banniere" hidden><small id="banniere-label"></small><b id="banniere-nom"></b></div>
  <div id="hint" hidden></div>

  <section class="ecran clair" id="ecran-titre">
    <h1>Marée</h1>
    <button class="btn enorme" id="b-carte">Jouer</button>
    <div class="rangee"><button class="btn second" id="b-fleuve">Le Grand Fleuve</button><button class="btn or" id="b-boutique-titre">Boutique</button></div>
  </section>

  <section id="ecran-carte" hidden>
    <div id="carte-tete">
      <button class="rond" id="b-carte-retour" aria-label="Retour">←</button>
      <h2>La carte</h2>
      <span class="jeton">★ <b id="carte-etoiles">0</b></span>
      <span class="jeton"><i class="piece"></i> <b id="carte-perles">0</b></span>
    </div>
    <div id="fiche" hidden>
      <small id="fiche-monde">Monde 1</small>
      <h3 id="fiche-nom">Le ruisseau</h3>
      <div class="etoiles" id="fiche-etoiles">★★★</div>
      <p class="petit" id="fiche-info"></p>
      <button class="btn" id="b-fiche-jouer">Larguer les amarres</button>
    </div>
    <div id="carte-pied">
      <button class="btn second" id="b-carte-fleuve">Grand Fleuve</button>
      <button class="btn or" id="b-carte-boutique" style="min-width: 0">Boutique</button>
      <button class="rond" id="b-tuto" aria-label="Revoir le tutoriel">?</button>
      <button class="rond" id="b-son" aria-label="Son">♪</button>
    </div>
  </section>

  <section class="ecran" id="ecran-victoire" hidden>
    <div class="panneau">
      <h2 id="v-titre">Bien navigué !</h2>
      <div class="etoiles" id="v-etoiles">★★★</div>
      <ul class="stats" id="v-stats"></ul>
      <button class="btn" id="b-suivant">Niveau suivant</button>
      <div class="rangee"><button class="btn second" id="b-rejouer">Rejouer</button><button class="btn second" id="b-v-carte">Carte</button></div>

<script>
/*CORE-START*/
// =====================================================================  règles (partagées avec les tests)
const PI = Math.PI;
const LY = [1.0, 1.6, 2.2, 2.8, 3.4];   // hauteur de la surface pour chacun des 5 niveaux d'eau
const SUB = 4;                          // images (à 30 i/s) pour passer d'un niveau au voisin
const STEP_T = SUB / 30;
const G = (LY.length - 1) * SUB + 1;    // positions intermédiaires de l'eau
const BOAT_HALF = 0.86, BOAT_DRAFT = 0.45, BOAT_TOP = 1.15, CLEAR = 0.12;
// Silhouette du bateau, morceau par morceau (x depuis le centre, hauteurs depuis la surface de l'eau).
// Seuls les morceaux qui sont sous l'obstacle comptent : la poupe peut repasser sous un pont
// pendant que Lou et le mât, plus hauts, en sont déjà sortis.
const BOAT_PARTS = [
  { x0: -0.8, x1: -0.6, bot: -0.12, top: 0.22 },   // poupe
  { x0: -0.6, x1: -0.45, bot: -0.36, top: 0.22 },
  { x0: -0.45, x1: 0.2, bot: -0.45, top: 0.22 },   // fond de la coque
  { x0: 0.2, x1: 0.6, bot: -0.4, top: 0.22 },
  { x0: 0.6, x1: 0.85, bot: -0.15, top: 0.22 },    // proue
  { x0: -0.52, x1: -0.02, bot: 0, top: 0.72 },     // cabine
  { x0: 0.17, x1: 0.56, bot: 0, top: 0.94 },       // Lou et sa casquette
  { x0: 0.08, x1: 0.48, bot: 0, top: 1.15 },       // mât et fanion
];
const yOfG = (g) => LY[0] + (LY[1] - LY[0]) * g / SUB;

function rng32(seed) {
  return function () {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const lerp = (a, b, t) => a + (b - a) * t;

// Un obstacle impose une fenêtre de niveaux [lo, hi] sur une portion de rivière [x0, x1] :
// le dessous du pont est juste au-dessus du mât au niveau hi, le haut du rocher juste sous la coque au niveau lo.
const evBottom = (ev) => LY[ev.hi] + BOAT_TOP + CLEAR;
const evTop = (ev) => LY[ev.lo] - BOAT_DRAFT - CLEAR;
function boatHits(ev, bx, y) {
  for (const p of BOAT_PARTS) {
    if (bx + p.x1 <= ev.x0 || bx + p.x0 >= ev.x1) continue;
    if (ev.hi < 4 && y + p.top > evBottom(ev)) return true;
    if (ev.lo > 0 && y + p.bot < evTop(ev)) return true;
  }
  return false;
}

// Recherche exhaustive : ensemble des états (hauteur d'eau, sens) atteignables sans rien toucher.
// L'eau, une fois en mouvement, va jusqu'au niveau voisin (comme dans le jeu).
function advance(front, x0, x1, speedAt, evs) {
  let f = front, x = x0;
  const dt = 1 / 30;
  while (x < x1) {
    x += speedAt(x) * dt;
    const near = evs.filter((e) => e.x0 < x + BOAT_HALF && e.x1 > x - BOAT_HALF);
    const ok = new Uint8Array(G);
    for (let g = 0; g < G; g++) ok[g] = near.every((e) => !boatHits(e, x, yOfG(g))) ? 1 : 0;
    const nf = new Uint8Array(G * 3);
    let any = false;
    for (let g = 0; g < G; g++) for (let d = 0; d < 3; d++) {
      if (!f[g * 3 + d]) continue;
      const opts = g % SUB === 0 ? [0, 1, -1] : [d === 1 ? 1 : -1];
      for (const o of opts) {
        const g2 = g + o;
        if (g2 < 0 || g2 >= G || !ok[g2]) continue;
        nf[g2 * 3 + (g2 % SUB === 0 ? 0 : o > 0 ? 1 : 2)] = 1; any = true;
      }
    }
    if (!any) return null;
    f = nf;
  }
  return f;
}
function startFront(level) { const f = new Uint8Array(G * 3); f[level * SUB * 3] = 1; return f; }

// ---------------------------------------------------------------------  mondes
const MONDES = [
  { id: 'pres', nom: 'La Rivière des Prés', lac: 'Lac des Prés',
    niveaux: ['Le ruisseau', 'Le premier pont', 'Les galets', 'Le moulin', 'Le gué', 'La passerelle', 'Les deux ponts', 'Le lavoir', 'Les nénuphars', 'L’écluse du village'] },
  { id: 'foret', nom: 'La Forêt Brumeuse', lac: 'Lac Sombre',
    niveaux: ['L’orée', 'Les troncs', 'Les branches basses', 'Le sous-bois', 'La brume', 'Le pont de lianes', 'Les racines', 'La clairière', 'Le grand chêne', 'La sortie du bois'] },
  { id: 'marais', nom: 'Le Marais', lac: 'Lac des Grenouilles',
    niveaux: ['Les roseaux', 'Le premier croco', 'Les pilotis', 'La vase', 'Le banc de sable', 'Le ponton', 'Les crocos jumeaux', 'La mangrove', 'Les lucioles', 'Le roi croco'] },
  { id: 'gorges', nom: 'Les Gorges Rouges', lac: 'Lac Rouge',
    niveaux: ['L’entrée des gorges', 'Les éboulis', 'L’arche', 'Le défilé', 'Les mouettes', 'Le canyon', 'Les rapides', 'La falaise', 'Le nid d’aigle', 'La grande arche'] },
  { id: 'fjord', nom: 'Le Fjord Glacé', lac: 'Lac Gelé',
    niveaux: ['La banquise', 'Les icebergs', 'L’arche de glace', 'Les phoques', 'Le givre', 'Les stalactites', 'Le glacier', 'Les aurores', 'Le passage nord', 'La source'] },
  { id: 'lagon', nom: 'Le Lagon Turquoise', lac: '', exclusif: true,
    niveaux: ['La plage', 'Les coraux', 'Le ponton fleuri', 'Les tortues', 'La cascade', 'Les palmiers', 'La grotte', 'Les flamants', 'Le récif', 'L’île au trésor'] },
];
const NB_MONDES = 5;  // mondes de la campagne ; le 6e est le monde exclusif de la boutique
// apparence des obstacles selon le monde : [obstacle par en dessous, obstacle par au-dessus]
const VISUELS = [['rocher', 'pont'], ['tronc', 'branches'], ['croco', 'ponton'], ['eboulis', 'arche'], ['iceberg', 'arcglace'], ['corail', 'liane']];

// Paramètres d'un niveau : d va de 0 (1-1) à 1 (5-10).
function levelParams(w, n) {
  const d = (w * 10 + n) / 49;
  return {
    d, v: 2.0 + 1.7 * d,
    count: 9 + Math.round(n * 1.4 + w * 2.5),
    gap0: lerp(2.6, 0.95, d), gap1: lerp(3.4, 1.45, d),   // secondes entre deux obstacles
    pWin: w === 0 && n < 3 ? 0 : 0.18 + 0.4 * d,           // fenêtre (dessus + dessous)
    pLock: w === 0 && n < 6 ? 0 : 0.08 + 0.17 * d,         // écluse : un seul niveau possible
    pBird: w >= 3 ? 0.25 : 0,
    change: 0.6 + 0.35 * d,                                // forcer un changement de niveau
    big: d,                                                // sauts de plusieurs niveaux
  };
}

// Tire un obstacle. last = fenêtre précédente (pour forcer des changements).
function makeEvent(r, P, x, last, w, attempt) {
  let kind = 'bas';
  const u = r();
  if (u < P.pLock) kind = 'ecluse'; else if (u < P.pLock + P.pWin) kind = 'fenetre'; else kind = r() < 0.5 ? 'bas' : 'haut';
  if (attempt > 12) kind = r() < 0.5 ? 'bas' : 'haut';
  let lo = 0, hi = 4;
  const lastMid = last ? Math.round((last.lo + last.hi) / 2) : 2;
  const far = (k) => Math.abs(k - lastMid);
  const pickLevel = (cands) => {
    const forced = r() < P.change ? cands.filter((k) => far(k) >= (r() < P.big ? 2 : 1)) : cands;
    const c = forced.length ? forced : cands;
    return c[Math.floor(r() * c.length)];
  };
  if (kind === 'bas') lo = pickLevel([1, 2, 3, 4]);
  else if (kind === 'haut') hi = pickLevel([0, 1, 2, 3]);
  else if (kind === 'fenetre') { lo = pickLevel([0, 1, 2, 3]); hi = Math.min(4, lo + (r() < 0.5 ? 1 : 2)); if (lo === 0) hi = Math.min(hi, 2); }
  else { lo = hi = pickLevel([0, 1, 2, 3, 4]); }
  if (kind === 'fenetre' && lo === 0 && hi === 4) hi = 2;
  const len = kind === 'ecluse' ? 0.9 + 0.4 * r() : 1.0 + 1.6 * r();
  const bird = kind === 'haut' && r() < P.pBird;
  return { x0: x, x1: x + len, lo, hi, kind, bird, w };
}

// Construit un niveau en garantissant qu'il existe un passage sans aucun choc.
function genLevel(w, n) {
  const P = levelParams(w === 5 ? 3 : w, n), r = rng32(7919 * (w * 10 + n + 1));  // le lagon est du niveau du monde 4
  const speed = () => P.v;
  const evs = [], pearls = [];
  let front = startFront(2), fx = 0, x = 7, last = null;
  for (let i = 0; i < P.count; i++) {
    const gap = Math.max(2.0, P.v * lerp(P.gap0, P.gap1, r()));
    let placed = false;
    for (let t = 0; t < 30 && !placed; t++) {
      const ev = makeEvent(r, P, x + gap, last, w, t);
      const nf = advance(front, fx, ev.x1 + BOAT_HALF + 0.05, speed, [ev]);
      if (nf) { evs.push(ev); front = nf; fx = ev.x1 + BOAT_HALF + 0.05; x = ev.x1; last = ev; placed = true; }
    }
    if (!placed) x += gap;
  }
  // perles : entre les obstacles et dans les fenêtres, à une hauteur atteignable
  for (let i = 0; i < evs.length; i++) {
    const e = evs[i];
    if (r() < 0.55) { const k = e.lo + Math.floor(r() * (e.hi - e.lo + 1)); pearls.push({ x: (e.x0 + e.x1) / 2, k }); }
    const nx = i + 1 < evs.length ? evs[i + 1].x0 : e.x1 + 4;
    if (nx - e.x1 > 3 && r() < 0.6) { const k = Math.floor(r() * 5); for (let j = 0; j < 3; j++) pearls.push({ x: e.x1 + 1.2 + j * 0.6, k }); }
  }
  return { w, n, v: P.v, events: evs, pearls, L: x + 9, P };
}

// ---- Tutoriel : un court parcours expliqué, avec le repère de passage (absent des vrais niveaux)
function genTuto() {
  const ev = (x0, len, lo, hi, kind, msg) => ({ x0, x1: x0 + len, lo, hi, kind, w: 0, msg });
  const events = [
    ev(9, 1.6, 3, 4, 'bas', 'Un rocher ! Touche le haut de l’écran pour monter l’eau.'),
    ev(17, 1.8, 0, 1, 'haut', 'Un pont bas ! Touche le bas de l’écran pour baisser l’eau.'),
    ev(25, 1.6, 2, 3, 'fenetre', 'Un pont au-dessus d’un rocher : passe entre les deux.'),
    ev(33, 1.0, 0, 0, 'ecluse', 'Une écluse : une seule hauteur passe. Tout en bas !'),
    ev(41, 1.6, 4, 4, 'bas', 'Le plus haut rocher : monte l’eau au maximum, plusieurs touches de suite.'),
  ];
  const pearls = [{ x: 13, k: 3 }, { x: 13.6, k: 3 }, { x: 21, k: 1 }, { x: 29, k: 2 }, { x: 37, k: 0 }, { x: 45, k: 4 }];
  return { w: 0, n: 0, v: 1.7, events, pearls, L: 48, tuto: true };
}

// ---- Grand Fleuve : génération par morceaux, toujours avec un passage garanti
const FLEUVE = { BIOME_LEN: 260, V0: 2.0, ACC: 0.0028, VMAX: 6.5, COEUR: 280 };
function fleuveSpeed(x) { return Math.min(FLEUVE.VMAX, FLEUVE.V0 + FLEUVE.ACC * Math.max(0, x)); }
function fleuveBiome(x) { return Math.floor(Math.max(0, x) / FLEUVE.BIOME_LEN) % MONDES.length; }
function makeFleuve(seed) {
  return { endless: true, r: rng32(seed), events: [], pearls: [], hearts: [], front: startFront(2), fx: 0, x: 8, last: null, nextHeart: FLEUVE.COEUR, L: Infinity };
}
function fleuveExtend(lv, upTo) {
  while (lv.x < upTo) {
    const d = Math.min(1, lv.x / 1400), v = fleuveSpeed(lv.x), w = fleuveBiome(lv.x);
    const P = { d, v, pWin: 0.15 + 0.45 * d, pLock: 0.05 + 0.2 * d, pBird: w >= 3 ? 0.25 : 0, change: 0.65 + 0.3 * d, big: 0.2 + 0.7 * d };
    const gap = Math.max(1.9, v * lerp(lerp(2.4, 0.85, d), lerp(3.0, 1.3, d), lv.r()));
    let placed = false;
    for (let t = 0; t < 30 && !placed; t++) {
      const ev = makeEvent(lv.r, P, lv.x + gap, lv.last, w, t);
      const nf = advance(lv.front, lv.fx, ev.x1 + BOAT_HALF + 0.05, fleuveSpeed, [ev]);
      if (nf) { lv.events.push(ev); lv.front = nf; lv.fx = ev.x1 + BOAT_HALF + 0.05; lv.x = ev.x1; lv.last = ev; placed = true;
        if (lv.r() < 0.5) lv.pearls.push({ x: (ev.x0 + ev.x1) / 2, k: ev.lo + Math.floor(lv.r() * (ev.hi - ev.lo + 1)) }); }
    }
    if (!placed) lv.x += gap;
    if (lv.x > lv.nextHeart) { lv.hearts.push({ x: lv.x + 1.5, k: lv.last ? lv.last.lo : 2 }); lv.nextHeart += FLEUVE.COEUR; }
  }
}
function fleuvePrune(lv, behind) {
  lv.events = lv.events.filter((e) => e.x1 > behind);
  lv.pearls = lv.pearls.filter((p) => p.x > behind);
  lv.hearts = lv.hearts.filter((p) => p.x > behind);
}
/*CORE-END*/

function rgb(c) { return c[0] === '#' ? [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16)) : c.match(/\d+/g).slice(0, 3).map(Number); }
function mix(c1, c2, t, al = 1) {
  const A = rgb(c1), B = rgb(c2), m = A.map((v, i) => Math.round(lerp(v, B[i], t)));
  return al < 1 ? `rgba(${m.join(',')},${al})` : `rgb(${m.join(',')})`;
}

}

      ctx.fillStyle = c[0]; ctx.beginPath(); ctx.moveTo(-20, 0); ctx.lineTo(-33, -10); ctx.quadraticCurveTo(-29, 0, -33, 10); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-2, -9); ctx.lineTo(6, -15); ctx.lineTo(10, -9); ctx.fill();
      ctx.fillStyle = '#141615'; ctx.beginPath(); ctx.arc(15, -2, 1.8, 0, 2 * PI); ctx.fill();
      if (f.type === 'or') { ctx.fillStyle = `rgba(255,250,235,${0.25 + 0.25 * Math.sin(clock * 6)})`; ctx.beginPath(); ctx.ellipse(2, -4, 10, 2, -0.1, 0, 2 * PI); ctx.fill(); }

  // bulles

  for (let i = 0; i < 18; i++) { const x = hash(i) * W, y = H - ((clock * 40 * (0.5 + hash(i + 3)) + hash(i + 6) * H) % (H * 0.62)); ctx.beginPath(); ctx.arc(x, y, 1 + 2 * hash(i + 9), 0, 2 * PI); ctx.fill(); }

  ctx.beginPath(); ctx.moveTo(x - 7, H * 0.3 + 4); ctx.lineTo(x, H * 0.3 - 3); ctx.lineTo(x + 7, H * 0.3 + 4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x - 7, H * 0.88 - 4); ctx.lineTo(x, H * 0.88 + 3); ctx.lineTo(x + 7, H * 0.88 - 4); ctx.stroke();
}

// =====================================================================  boutique
let boutTab = 'boites', dernierLot = null;
function ouvrirBoutique(tab) {

  mode = 'boutique'; lv = null; lac = null; hudVisible(false); screens('ecran-boutique'); renderBoutique(); setTheme(0); setAmb(0.02);
}
// Dessine le bateau (avec un équipement donné) dans un petit canvas de la boutique.

  const sv = [ctx, S, tilt, serie];
  ctx = c2; S = h * 0.36 * zoom; tilt = 0; serie = 0;
  const g = c2.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, bg ? bg[0] : '#8aa6b6'); g.addColorStop(0.62, bg ? bg[1] : '#e6dfcf'); g.addColorStop(0.62, '#5f8fa0'); g.addColorStop(1, '#1c3f4e');

  drawBoat(w * 0.56 - (zoom - 1) * S * 0.5, h * 0.64 + (zoom - 1) * S * 0.55, 1.2, 0, look);

const zoomDe = (it) => (it.cat === 'perso' || it.cat === 'chapeau' ? 1.7 : 1);

  return l;
}
const pct = (v) => String(v).replace('.', ',') + '\u00a0%';
function renderBoutique() {

      const card = el('div', 'boite-carte');

    });
  } else if (boutTab === 'objets' || boutTab === 'garde') {
    const garde = boutTab === 'garde';
    if (garde) {

      top.append(cv2); top.append(el('p', 'note', 'Touche un objet pour l’équiper : équipage, bateau, chapeau, fanion et sillage se combinent.')); C.append(top); dessinerApercu(cv2, save.equip);
    } else C.append(el('p', 'note', 'Achat direct : plus cher que les boîtes, mais tu choisis ton objet.'));
    for (const cat of Object.keys(CATS)) {

      if (!items.length) continue;
      C.append(el('h3', 'cat-titre', CATS[cat]));
      const grid = el('div', 'cartes');
      for (const it of items) {
        const R = RARETES[it.rar], owned = !!save.owned[it.id];
        const equipe = save.equip[cat] === it.id;
        const card = el('button', 'carte-obj' + (garde && equipe ? ' equipe' : ''));
        const cv2 = document.createElement('canvas'); cv2.width = 240; cv2.height = 180;
        card.append(cv2, el('span', 'rar', R.nom), el('span', 'nom', it.nom));

        }

    card.append(cv2);

    card.append(el('p', 'note', 'Monde exclusif : 10 niveaux sous les palmiers, entre coraux et ponts de lianes. Une île au large, sur la carte.'));
    const btn = el('button', 'btn or', save.lagon ? 'Voir sur la carte' : `Débloquer · ${PRIX_LAGON}`);
    if (!save.lagon && save.pieces < PRIX_LAGON) btn.disabled = true, btn.style.opacity = 0.5;
    btn.onclick = () => { if (save.lagon) { ouvrirCarte(50); return; } if (save.pieces < PRIX_LAGON) return; save.pieces -= PRIX_LAGON; save.lagon = true; persist(); sfx.palier(25); confettis(120); banner('Le Lagon Turquoise', 'Monde débloqué'); renderBoutique(); };

    const g = c2.createLinearGradient(0, 0, 0, 300); g.addColorStop(0, '#6fa3b5'); g.addColorStop(0.55, '#e7ede4'); g.addColorStop(0.55, '#5cb0b1'); g.addColorStop(1, '#1a6171');

function equiper(it) {

}

}
// Ouverture d'une boîte : environ 1,5 s entre le clic et l'objet révélé.
function ouvrirBoite(b) {

  save.pieces -= b.prix; save.boites++;
  let u = Math.random() * 100, rar = 0;
  for (let k = 0; k < 4; k++) { if (u < b.chances[k]) { rar = k; break; } u -= b.chances[k]; rar = k; }
  const pool = ITEMS.filter((i) => i.rar === rar), it = pool[Math.floor(Math.random() * pool.length)];
  const doublon = !!save.owned[it.id];
  if (doublon) save.pieces += RARETES[rar].doublon; else save.owned[it.id] = 1;
  persist();
  const box = $('ouv-boite'); box.style.setProperty('--b1', b.col[0]); box.style.setProperty('--b2', b.col[1]);
  box.className = 'boite'; box.hidden = false; show('lot', false); screens('ecran-ouverture');
  void box.offsetWidth; box.classList.add('secoue');
  if (sfx.ok()) { const t = Snd.ac.currentTime; for (let i = 0; i < 8; i++) noise(t + i * 0.08, 0.06, 0.05 + i * 0.01, 'bandpass', 300 + i * 60, 500 + i * 80, 3); }
  setTimeout(() => {
    box.classList.add('ouverte'); flash(alpha(RARETES[rar].col, 0.6)); buzz(rar >= 2 ? [30, 40, 60] : 20);
    if (rar >= 3) { sfx.palier(50); confettis(160); } else if (rar === 2) { sfx.palier(15); confettis(70); } else sfx.victoire();
    setTimeout(() => { box.hidden = true; montrerLot(it, doublon, false); }, 380);
  }, 760);
}
function montrerLot(it, doublon, achat) {
  const R = RARETES[it.rar]; dernierLot = it;
  screens('ecran-ouverture'); $('ouv-boite').hidden = true;
  $('lot').style.setProperty('--lueur', alpha(R.col, 0.55));

  $('lot-msg').textContent = doublon ? `Déjà dans ta collection : +${R.doublon} pièces.` : achat ? 'Ajouté à ta garde-robe.' : `Nouveau ! ${CATS[it.cat]} · ajouté à ta garde-robe.`;
  $('b-lot-equiper').hidden = doublon;

function renderFondBoutique() {

  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); drawParticles(0);
}

// =====================================================================  écran titre animé
function renderTitre() {
  if (!lv || !lv.demo) { lv = genLevel(0, 3); lv.demo = true; lv.w = Math.floor(clock / 8) % 5; bx = 0; }
  bx += 1.6 / 60; wy = LY[2] + Math.sin(clock * 0.6) * 0.9; tilt = 0;
  if (bx > lv.L - 6) bx = 0;
  renderJeu();
}

// =====================================================================  boucle
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000 || 0); last = t;
  update(dt); updateFinAnim(dt);
  if (mode === 'carte') renderCarte();
  else if (mode === 'boutique') renderFondBoutique();
  else if (mode === 'lac' || (mode === 'fin' && lac && !lv)) renderLac();

}

// =====================================================================  commandes
function changerNiveau(d) {
  const n = clamp(ti + d, 0, 4); if (n === ti) return;
  ti = n; (d > 0 ? sfx.up : sfx.down)(); buzz(8);
  if (mode === 'jeu') for (let i = 0; i < 6; i++) particles.push({ x: bx + (Math.random() - 0.5) * 1.2, y: wy, vx: (Math.random() - 0.5) * 2, vy: 1 + Math.random() * 2, life: 0.5, r: 0.04 + Math.random() * 0.05, kind: 'goutte', g: 9 });
}
let drag = null;
cv.addEventListener('pointerdown', (ev) => {
  audioInit();
  if (mode === 'carte') { drag = { y: ev.clientY, x: ev.clientX, y0: ev.clientY, moved: 0, t: performance.now() }; carteVel = 0; try { cv.setPointerCapture(ev.pointerId); } catch (e) {} return; }
  if (mode === 'pret') { partir(); return; }
  if (mode !== 'jeu' && mode !== 'lac') return;
  changerNiveau(ev.clientY < H / 2 ? 1 : -1);
  drag = { y: ev.clientY, game: true }; try { cv.setPointerCapture(ev.pointerId); } catch (e) {}
});
cv.addEventListener('pointermove', (ev) => {
  if (!drag) return;
  if (mode === 'carte') { const dy = ev.clientY - drag.y; carteY -= dy / carteScale; drag.moved += Math.abs(dy); carteVel = -dy / carteScale / Math.max(0.016, (performance.now() - drag.t) / 1000); drag.t = performance.now(); drag.y = ev.clientY; clampCarte(); return; }
  if (drag.game) { const step = Math.max(36, H * 0.07), dy = ev.clientY - drag.y; if (Math.abs(dy) >= step) { changerNiveau(dy < 0 ? 1 : -1); drag.y += Math.sign(dy) * step; } }
});
cv.addEventListener('pointerup', (ev) => {
  if (mode === 'carte' && drag && drag.moved < 8) {
    carteVel = 0;
    const mx = ev.clientX / carteScale, my = ev.clientY / carteScale + carteY;
    let best = null, bd = 50 / carteScale + 20;
    for (const n of NODES) { const d = Math.hypot(n.x - mx, n.y - my); if (d < bd) { bd = d; best = { idx: n.idx }; } }
    for (const l of LACS) { const d = Math.hypot(l.x - mx, l.y - my); if (d < 110 && d < bd) { bd = d; best = { lac: l.w }; } }
    if (best) choisirNoeud(best); else show('fiche', false);
  }
  drag = null;
});
cv.addEventListener('pointercancel', () => { drag = null; });
cv.addEventListener('wheel', (ev) => { if (mode === 'carte') { carteY += ev.deltaY / carteScale; clampCarte(); } }, { passive: true });
window.addEventListener('keydown', (ev) => {
  const k = ev.key.toLowerCase(), up = k === 'arrowup' || k === 'z' || k === 'w', down = k === 'arrowdown' || k === 's';
  if (mode === 'carte' && (up || down)) { carteY += (down ? 1 : -1) * 120; clampCarte(); return; }
  if (!up && !down && k !== ' ') return;
  if (mode === 'pret') { audioInit(); partir(); return; }
  if ((mode !== 'jeu' && mode !== 'lac') || ev.repeat) return;
  ev.preventDefault(); changerNiveau(up ? 1 : -1);
});
function pause() { if (mode === 'jeu' || mode === 'pret') { lv.modeAvant = mode; mode = 'pause'; setAmb(0); screens('ecran-pause'); } else if (mode === 'lac') { lac.pause = true; mode = 'pause'; screens('ecran-pause'); } }

const rejouer = () => { if (lac && !lv) demarrerLac(lac.w); else if (cur === -2) demarrerTuto(); else if (cur < 0) demarrerFleuve(); else demarrerNiveau(cur); };
$('b-carte').onclick = () => { audioInit(); sfx.carte(); if (!save.tuto) demarrerTuto(); else ouvrirCarte(); };
$('b-fleuve').onclick = () => { audioInit(); sfx.clic(); lac = null; demarrerFleuve(); };
$('b-boutique-titre').onclick = () => { audioInit(); sfx.clic(); ouvrirBoutique(); };

for (const b of $('onglets').children) b.onclick = () => { boutTab = b.dataset.tab; sfx.clic(); renderBoutique(); };

$('b-carte-fleuve').onclick = () => { sfx.clic(); lac = null; demarrerFleuve(); };

$('b-reprendre').onclick = () => { screens(null); if (lac && !lv) { mode = 'lac'; lac.pause = false; } else { mode = lv.modeAvant || 'jeu'; setAmb(0.06); } };
$('b-recommencer').onclick = rejouer;
$('b-p-carte').onclick = () => ouvrirCarte(cur >= 0 ? cur : undefined);
$('b-rejouer').onclick = rejouer; $('b-reessayer').onclick = rejouer;
$('b-v-carte').onclick = () => ouvrirCarte(cur); $('b-d-carte').onclick = () => ouvrirCarte(cur); $('b-fin-carte').onclick = () => ouvrirCarte();
$('b-suivant').onclick = () => { if (cur === -2) ouvrirCarte(0); else if (cur === 49 || cur === 59) ouvrirCarte(cur); else if (cur % 10 === 9) { ouvrirCarte(cur + 1); banner(MONDES[Math.floor((cur + 1) / 10)].nom, 'Nouveau monde'); sfx.palier(10); } else demarrerNiveau(cur + 1); };

</script>

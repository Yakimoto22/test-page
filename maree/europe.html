#erreur { position: absolute; inset: 0; display: grid; place-items: center; padding: 30px; text-align: center; color: var(--brume); }

let SV = { e: {}, test: false };
try { SV = Object.assign(SV, JSON.parse(localStorage.getItem(SAVE3D) || '{}')); } catch (e) {}
const sauver = () => { try { localStorage.setItem(SAVE3D, JSON.stringify(SV)); } catch (e) {} };
const cleNiv = (ip, w, n) => `${EU.pays[ip].id}-${w}-${n}`;
const etoilesNiv = (ip, w, n) => SV.e[cleNiv(ip, w, n)] || 0;
const ouvert = (ip, w, n) => SV.test || n === 0 || etoilesNiv(ip, w, n - 1) > 0;
const etoilesPays = (ip) => EU.pays[ip].mondes.reduce((t, m, w) => t + Array.from({ length: m.n }, (_, n) => etoilesNiv(ip, w, n)).reduce((a, b) => a + b, 0), 0);
const niveauxPays = (P) => P.mondes.reduce((t, m) => t + m.n, 0);
const etoilesTotal = () => Object.values(SV.e).reduce((a, b) => a + b, 0);
const REGIONS = { ouest: 'Europe de l’Ouest', britannique: 'Îles Britanniques', nord: 'Europe du Nord', alpin: 'Alpes', nordique: 'Scandinavie', med: 'Méditerranée', est: 'Europe de l’Est' };
function decoder(enc) { const out = []; let x = 0, y = 0; for (let i = 0; i < enc.length; i += 2) { x += enc[i]; y += enc[i + 1]; out.push([x / EU.Q, y / EU.Q]); } return out; }
const kmEntre = (a, b) => { const la = ((a[1] + b[1]) / 2) * PI / 180; return Math.hypot((a[0] - b[0]) * 111.32 * Math.cos(la), (a[1] - b[1]) * 110.57); };
let SEL = null, COURS = [], DIFF = 0;
function definirNiveau(ip, w, n) {
  const P = EU.pays[ip], m = P.mondes[w];
  SEL = { ip, w, n }; THEME = Object.assign({}, THEMES[P.th] || THEMES.ouest, ARBRES_PAYS[P.id] || {});
  COURS = decoder(m.pts);
  const cum = [0]; for (let i = 1; i < COURS.length; i++) cum.push(cum[i - 1] + kmEntre(COURS[i - 1], COURS[i]));

  while (inter.length > 4) inter = inter.filter((_, i) => i % 2 === 0);

}

// ---- carte de l'Europe (2D), glisser, molette et pincement pour zoomer, toucher un pays
const CE = { cx: 10, cy: -54, z: 1, ptrs: new Map(), sel: null, chemins: null };
const KLAT = Math.cos(52 * PI / 180);
const proj = ([lon, lat]) => [lon * KLAT, -lat];
function cheminsEurope() {
  if (CE.chemins) return CE.chemins;
  CE.chemins = EU.pays.map((P) => { const p = new Path2D(); for (const r of P.contour) r.forEach((q, i) => { const [x, y] = proj(q); i ? p.lineTo(x, y) : p.moveTo(x, y); }); p.closePath();
    const f = new Path2D(); for (const m of P.mondes) decoder(m.pts).forEach((q, i) => { const [x, y] = proj(q); i ? f.lineTo(x, y) : f.moveTo(x, y); });
    return { pays: p, fleuves: f }; });
  CE.hit = document.createElement('canvas').getContext('2d');
  return CE.chemins;
}
function cadrerEurope() { const cv = $('carte-eu'), w = cv.clientWidth, h = cv.clientHeight; CE.z = Math.max(Math.min(w / 46, h / 34) * 1.05, w / 30); CE.cx = 13 * KLAT; CE.cy = -51; }
function dessinerEurope() {

  const px = 1 / CE.z;
  EU.pays.forEach((P, i) => {
    const e = etoilesPays(i), vide = !P.mondes.length;
    c.fillStyle = CE.sel === i ? '#4f6a55' : vide ? '#22313d' : e > 0 ? '#3e5a4a' : '#2c4252'; c.fill(CH[i].pays);
  });
  c.strokeStyle = 'rgba(243,239,230,.22)'; c.lineWidth = 0.8 * px; EU.pays.forEach((_, i) => c.stroke(CH[i].pays));
  c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = 'rgba(122,172,196,.85)'; c.lineWidth = 1.3 * px; EU.pays.forEach((_, i) => c.stroke(CH[i].fleuves));
  if (CE.sel != null) { c.strokeStyle = '#d9b56f'; c.lineWidth = 1.6 * px; c.stroke(CH[CE.sel].pays); c.strokeStyle = '#e8c784'; c.lineWidth = 2 * px; c.stroke(CH[CE.sel].fleuves); }
  c.restore();
  // noms des pays, sans chevauchement
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = '500 9.5px Outfit, sans-serif'; if (c.letterSpacing !== undefined) c.letterSpacing = '1.5px';
  const places = [];
  if (!CE.aires) CE.aires = EU.pays.map((P) => P.contour.reduce((t, r) => { let a = 0; for (let k = 0; k < r.length; k++) { const [x1, y1] = r[k], [x2, y2] = r[(k + 1) % r.length]; a += x1 * y2 - x2 * y1; } return t + Math.abs(a) / 2; }, 0));
  const ordre = EU.pays.map((P, i) => i).sort((a, b) => CE.aires[b] - CE.aires[a]);
  for (const i of ordre) {
    const P = EU.pays[i], [x0, y0] = proj(P.lab), x = (x0 - CE.cx) * CE.z + w / 2, y = (y0 - CE.cy) * CE.z + h / 2;
    if (x < 0 || x > w || y < 60 || y > h - 20) continue;
    const t = P.nom.toUpperCase(), tw = c.measureText(t).width, r = [x - tw / 2 - 3, y - 7, x + tw / 2 + 3, y + 7];
    if (places.some((q) => r[0] < q[2] && r[2] > q[0] && r[1] < q[3] && r[3] > q[1])) continue; places.push(r);
    c.fillStyle = CE.sel === i ? '#e8c784' : P.mondes.length ? 'rgba(243,239,230,.75)' : 'rgba(243,239,230,.35)';
    c.shadowColor = 'rgba(0,0,0,.6)'; c.shadowBlur = 3; c.fillText(t, x, y); c.shadowBlur = 0;

}
function paysSousEU(sx, sy) {
  const cv = $('carte-eu'), w = cv.clientWidth, h = cv.clientHeight, x = (sx - w / 2) / CE.z + CE.cx, y = (sy - h / 2) / CE.z + CE.cy, CH = cheminsEurope();
  for (let i = 0; i < EU.pays.length; i++) if (CE.hit.isPointInPath(CH[i].pays, x, y)) return i;
  return null;
}
function choisirPaysEU(i) {
  CE.sel = i; const P = EU.pays[i];
  $('fp-region').textContent = REGIONS[P.th] || ''; $('fp-nom').textContent = P.nom;
  $('fp-info').innerHTML = P.mondes.length ? `${P.mondes.length} monde${P.mondes.length > 1 ? 's' : ''} · ${niveauxPays(P)} niveaux · <b>${etoilesPays(i)}</b> / ${niveauxPays(P) * 3} ★<br>${P.mondes.map((m) => m.nom).join(' · ')}` : 'Aucun cours d’eau assez long dans ce pays.<br>Lacs et côtes : bientôt.';
  $('b-fp').hidden = !P.mondes.length; $('fiche-pays').hidden = false;

}
function ouvrirEurope() {
  mode = 'menu'; ecran('ecran-europe'); $('hud').hidden = true; $('eu-etoiles').textContent = etoilesTotal(); $('b-test').classList.toggle('actif', SV.test);
  $('b-test').textContent = SV.test ? 'Test : tout est ouvert' : 'Test : tout débloquer';

  requestAnimationFrame(dessinerEurope);
}
function ouvrirPays(ip) {
  mode = 'menu'; ecran('ecran-pays'); $('hud').hidden = true;
  const P = EU.pays[ip]; $('pays-nom').textContent = P.nom; $('pays-etoiles').textContent = `${etoilesPays(ip)} / ${niveauxPays(P) * 3}`;
  const box = $('mondes'); box.innerHTML = '';

    carte.innerHTML = `<div class="monde-tete"><small>Monde ${w + 1}</small><h3>${m.nom}</h3><span>${Math.round(m.km)} km · ${et} / ${m.n * 3} ★</span></div><p class="parcours">${m.coupes[0] || 'Source'} → ${m.coupes[m.n] || 'Fin'}</p>`;
    const grille = document.createElement('div'); grille.className = 'niveaux';
    for (let n = 0; n < m.n; n++) {
      const b = document.createElement('button'), e = etoilesNiv(ip, w, n), ok = ouvert(ip, w, n);
      b.className = 'niv' + (ok ? '' : ' ferme') + (e ? ' fait' : ''); b.innerHTML = `<b>${n + 1}</b><i>${ok ? '★'.repeat(e) + '<em>' + '★'.repeat(3 - e) + '</em>' : '·'}</i>`;
      b.title = `${m.coupes[n] || 'Km ' + Math.round(m.km * n / m.n)} → ${m.coupes[n + 1] || 'Km ' + Math.round(m.km * (n + 1) / m.n)}`;

function lancerNiveau(ip, w, n) {
  ecran(null); $('chargement').hidden = false;
  setTimeout(() => {   // laisse l'écran de chargement s'afficher avant la construction de la scène
    const info = chargerNiveau(ip, w, n);
    $('chargement').hidden = true;
    $('d-sur').textContent = `${info.pays} · monde ${w + 1} · niveau ${n + 1}/${EU.pays[ip].mondes[w].n}`;
    $('d-titre').textContent = info.monde;
    $('d-sous').textContent = `${info.depart} → ${info.arrivee} · ${Math.round(info.km)} km de fleuve`;
    mode = 'depart'; ecran('ecran-depart');
  }, 30);
}
function ecran(id) { for (const e of ['ecran-europe', 'ecran-pays', 'ecran-depart', 'ecran-fin']) $(e).hidden = e !== id; }

// ---- démarrage
$('b-partir').onclick = () => { audio(); demarrer(); };
$('b-rejouer').onclick = () => { audio(); mode = 'depart'; demarrer(); };
$('b-depart-retour').onclick = () => ouvrirPays(SEL.ip);
$('b-fleuves').onclick = () => ouvrirPays(SEL.ip);
$('b-fp').onclick = () => { if (CE.sel != null) ouvrirPays(CE.sel); };
$('b-pays-retour').onclick = () => ouvrirEurope();
$('b-test').onclick = () => { SV.test = !SV.test; sauver(); ouvrirEurope(); };
$('b-liste').onclick = () => {
  const l = $('liste-pays'); if (!l.hidden) { l.hidden = true; return; }
  l.innerHTML = ''; EU.pays.map((P, i) => [P, i]).sort((a, b) => a[0].nom.localeCompare(b[0].nom, 'fr')).forEach(([P, i]) => {
    const b = document.createElement('button'); b.innerHTML = `${P.nom}<span>${P.mondes.length ? P.mondes.length + ' mondes · ' + etoilesPays(i) + ' ★' : 'pas de grand cours d’eau'}</span>`;
    b.onclick = () => { l.hidden = true; choisirPaysEU(i); }; l.append(b); });
  l.hidden = false;
};
// carte de l'Europe : glisser pour se déplacer, molette ou pincement pour zoomer, toucher un pays
(() => {
  const cv = $('carte-eu');
  cv.addEventListener('pointerdown', (ev) => { CE.ptrs.set(ev.pointerId, { x: ev.clientX, y: ev.clientY, x0: ev.clientX, y0: ev.clientY }); CE.bouge = CE.ptrs.size > 1 ? 99 : 0; try { cv.setPointerCapture(ev.pointerId); } catch (e) {} });
  cv.addEventListener('pointermove', (ev) => {
    const p = CE.ptrs.get(ev.pointerId); if (!p) return;
    if (CE.ptrs.size === 2) { const [a, b] = [...CE.ptrs.values()], d0 = Math.hypot(a.x - b.x, a.y - b.y); p.x = ev.clientX; p.y = ev.clientY; const d1 = Math.hypot(a.x - b.x, a.y - b.y); if (d0 > 0) zoomEU(d1 / d0, (a.x + b.x) / 2, (a.y + b.y) / 2); CE.bouge = 99; return; }
    CE.cx -= (ev.clientX - p.x) / CE.z; CE.cy -= (ev.clientY - p.y) / CE.z; CE.bouge = Math.max(CE.bouge, Math.hypot(ev.clientX - p.x0, ev.clientY - p.y0)); p.x = ev.clientX; p.y = ev.clientY; dessinerEurope();
  });
  const fin = (ev) => { const p = CE.ptrs.get(ev.pointerId); CE.ptrs.delete(ev.pointerId); if (p && CE.ptrs.size === 0 && CE.bouge < 8) { const i = paysSousEU(ev.clientX, ev.clientY); if (i != null) choisirPaysEU(i); else { CE.sel = null; $('fiche-pays').hidden = true; dessinerEurope(); } } };
  cv.addEventListener('pointerup', fin); cv.addEventListener('pointercancel', (ev) => CE.ptrs.delete(ev.pointerId));
  cv.addEventListener('wheel', (ev) => { ev.preventDefault(); zoomEU(Math.exp(-ev.deltaY * (ev.deltaMode === 1 ? 0.05 : 0.0018)), ev.clientX, ev.clientY); }, { passive: false });
  addEventListener('resize', () => { if (mode === 'menu') dessinerEurope(); });
})();
function zoomEU(f, sx, sy) {
  const cv = $('carte-eu'), w = cv.clientWidth, h = cv.clientHeight, x = (sx - w / 2) / CE.z + CE.cx, y = (sy - h / 2) / CE.z + CE.cy;
  CE.z = clamp(CE.z * f, Math.min(w / 60, h / 45), 200); CE.cx = x - (sx - w / 2) / CE.z; CE.cy = y - (sy - h / 2) / CE.z; dessinerEurope();
}
try {
  if (!window.THREE) throw new Error('three.js absent');
